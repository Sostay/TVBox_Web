name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build TVBox Web Android APK (Fixed Signature)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure Fixed Release Keystore Exists
        run: |
          if [ ! -f android/app/release.jks ]; then
            echo "Generating permanent fixed release.jks..."
            keytool -genkeypair -v \
              -keystore android/app/release.jks \
              -alias tvbox \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass tvboxweb123 \
              -keypass tvboxweb123 \
              -dname "CN=TVBox Web, O=TVBox, C=CN" \
              -noprompt
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.jks
            git commit -m "chore(signing): permanently commit fixed release.jks for reproducible upgrades" || true
            git push origin main || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Signed Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Web-Server.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
