<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>配置中心</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#0a0f1c;--panel:rgba(19,30,48,.86);--panel2:#101929;
      --line:rgba(91,176,232,.24);--line2:rgba(237,169,58,.32);
      --text:#eef6ff;--muted:#91a6bd;--cyan:#38c7ff;--gold:#eda93a;
      --ok:#35d399;--bad:#fb7185;--warn:#f5c76b;--blue:#2b7ea2;
      --shadow:0 20px 55px rgba(0,0,0,.32);
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 16% 0,rgba(44,89,151,.78) 0,rgba(15,24,40,.95) 42%,#080c16 100%),
        linear-gradient(115deg,rgba(56,199,255,.08),transparent 40%,rgba(237,169,58,.08));
    }
    body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.035),transparent 28%,rgba(255,255,255,.025));pointer-events:none}
    button,input,textarea,select{font:inherit}
    button{border:0;border-radius:8px;min-height:38px;padding:0 14px;font-weight:750;cursor:pointer;background:#17243a;color:#dceaff;border:1px solid rgba(91,176,232,.22)}
    button.primary{background:var(--gold);color:#132033;border-color:transparent}
    button.secondary{background:var(--blue);color:#f1fbff;border-color:transparent}
    button.register{background:#22a983;color:#f5fffb;border-color:transparent}
    button.danger{background:#8d2530;color:#fff;border-color:transparent}
    button.ghost{background:transparent}
    button:disabled{opacity:.5;cursor:wait}
    input,textarea,select{width:100%;border:1px solid rgba(91,176,232,.26);background:#0e1727;color:var(--text);border-radius:8px;outline:none}
    input,select{height:40px;padding:0 12px}
    textarea{min-height:132px;padding:12px;resize:vertical;line-height:1.55}
    label{display:block;color:#b8c7d8;font-size:13px;margin:0 0 8px}
    .wrap{position:relative;max-width:1180px;margin:0 auto;padding:22px}
    .hero{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
    .title{font-size:28px;font-weight:850;letter-spacing:0}
    .sub{margin-top:7px;color:var(--muted);font-size:14px}
    .host{border:1px solid rgba(56,199,255,.35);border-radius:999px;background:rgba(8,17,30,.72);padding:9px 13px;color:#c8f1ff;font-size:13px;white-space:nowrap}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:8px;border:1px solid var(--line);border-radius:8px;background:rgba(12,22,37,.62)}
    .tab{border-radius:7px;padding:9px 14px}
    .tab.active{background:var(--gold);color:#132033}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);backdrop-filter:blur(12px);overflow:hidden}
    .panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);background:rgba(9,17,30,.55)}
    .panel-head h2{font-size:20px;margin:0}
    .hint{color:var(--muted);font-size:13px;margin-top:5px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px}
    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}
    .card{min-height:116px;border:1px solid rgba(91,176,232,.20);border-radius:8px;background:rgba(11,21,35,.70);padding:14px;cursor:pointer}
    .card:hover,.card.active{border-color:rgba(237,169,58,.58);background:rgba(16,29,48,.92)}
    .card-title{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .name{font-size:17px;font-weight:820}
    .meta{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.55}
    .badge{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:999px;font-size:12px;border:1px solid rgba(145,166,189,.26);background:#17243a;color:#b8c7d8;white-space:nowrap}
    .badge.ok{border-color:rgba(53,211,153,.38);background:rgba(53,211,153,.13);color:#8df1ca}
    .badge.bad{border-color:rgba(251,113,133,.38);background:rgba(251,113,133,.13);color:#ffb2bd}
    .badge.warn{border-color:rgba(245,199,107,.45);background:rgba(245,199,107,.12);color:#f7d48c}
    .detail{position:sticky;top:14px;align-self:start;max-height:calc(100vh - 28px);overflow:auto;border:1px solid var(--line2);background:linear-gradient(145deg,rgba(73,58,38,.62),rgba(16,26,42,.86));border-radius:8px;padding:16px;min-height:360px}
    .detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
    .detail h3{font-size:20px;margin:0}
    .drawer-close{display:none;min-width:38px;width:38px;padding:0;border-radius:999px;font-size:20px;line-height:1;background:rgba(23,36,58,.95)}
    .status{border:1px solid rgba(91,176,232,.20);background:#0e1727;border-radius:8px;padding:11px 12px;line-height:1.65;color:#d9e8f8;white-space:pre-wrap;word-break:break-word}
    .status.bad{border-color:rgba(251,113,133,.32);color:#ffbdc6}
    .field{display:grid;gap:12px;margin-top:14px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .qr-actions{display:flex;gap:10px;align-items:center;margin-top:10px}
    .qr-actions button{min-width:104px;display:inline-flex;align-items:center;justify-content:center;line-height:1}
    .confirm-login{background:linear-gradient(135deg,#2fa7d8,#2a7fb2);color:#eefaff;border-color:rgba(102,202,255,.34);box-shadow:0 8px 20px rgba(27,132,190,.18)}
    .confirm-login:hover{filter:brightness(1.06)}
    .order-editor{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;margin-top:12px}
    .order-editor select{height:230px;padding:8px}
    .side-actions{display:grid;gap:8px;align-content:start}
    .site-list{display:grid;gap:8px;max-height:62vh;overflow:auto;padding-right:2px}
    .site-row{display:grid;grid-template-columns:112px 64px minmax(0,1fr) 98px;gap:10px;align-items:center;border:1px solid rgba(91,176,232,.20);background:#0e1727;border-radius:8px;padding:10px}
    .site-row.disabled{opacity:.55}
    .site-row.selected{border-color:rgba(243,170,47,.72);box-shadow:0 0 0 2px rgba(243,170,47,.14)}
    .site-row.dragging{opacity:.45}
    .site-row.drag-over{border-color:rgba(91,176,232,.70);background:#12233a}
    .site-drag{height:36px;border:1px solid rgba(91,176,232,.28);border-radius:7px;background:#0a1322;color:#c7d8ea;display:flex;align-items:center;justify-content:center;gap:7px;cursor:grab;font-weight:800;user-select:none;font-size:13px}
    .site-drag-mark{color:#91a9c1;font-size:16px;line-height:1}
    .site-drag:active{cursor:grabbing}
    .site-main{min-width:0}
    .site-name{font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .site-meta{margin-top:4px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .site-toggle{display:flex;gap:6px;align-items:center;margin:0;color:#d9e8f8;font-size:13px}
    .site-toggle input{width:16px;height:16px;margin:0}
    .site-move{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .site-move button{min-width:0;padding:0}
    .drawer-mask{display:none}
    .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:88vw;padding:11px 16px;border-radius:999px;background:rgba(8,15,26,.94);border:1px solid rgba(91,176,232,.30);color:#eef6ff;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.18s}
    .toast.show{opacity:1}
    body.drawer-mode{overflow-x:hidden}
    body.drawer-mode .panel{overflow:visible}
    body.drawer-mode .layout{display:block}
    body.drawer-mode .cards{grid-template-columns:1fr}
    body.drawer-mode .detail{position:fixed;left:12px;right:12px;bottom:12px;top:auto;z-index:60;max-height:78vh;min-height:0;overflow:auto;padding:16px;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.58);transform:translateY(calc(100% + 28px));pointer-events:none;transition:transform .2s ease}
    body.drawer-mode .drawer-close{display:inline-flex;align-items:center;justify-content:center}
    body.drawer-mode .drawer-mask{display:block;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.48);opacity:0;pointer-events:none;transition:opacity .18s ease}
    body.drawer-mode.drawer-open{overflow:hidden}
    body.drawer-mode.drawer-open .detail{transform:translateY(0);pointer-events:auto}
    body.drawer-mode.drawer-open .drawer-mask{opacity:1;pointer-events:auto}
    @media(max-width:1180px){
      .wrap{padding:14px}.hero{display:block}.host{display:inline-block;margin-top:12px}.layout{display:block}.cards{grid-template-columns:1fr}.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
      .panel{overflow:visible}
      .detail{position:fixed;left:12px;right:12px;bottom:12px;top:auto;z-index:30;max-height:78vh;min-height:0;overflow:auto;padding:16px;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.58);transform:translateY(calc(100% + 28px));transition:transform .2s ease}
      .drawer-close{display:inline-flex;align-items:center;justify-content:center}
      .drawer-mask{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.48);opacity:0;pointer-events:none;transition:opacity .18s ease}
      body.drawer-open{overflow:hidden}
      body.drawer-open .detail{transform:translateY(0)}
      body.drawer-open .drawer-mask{opacity:1;pointer-events:auto}
    }
    @media(max-width:560px){
      .panel-head{display:block}.row,.order-editor{grid-template-columns:1fr}.title{font-size:24px}
      .site-list{gap:10px;max-height:58vh}
      .site-row{grid-template-columns:1fr 96px;gap:10px;padding:12px}
      .site-drag{grid-column:1/2;min-height:42px}
      .site-toggle{grid-column:2/3;justify-content:center;height:42px;border:1px solid rgba(91,176,232,.22);border-radius:7px;background:#0a1322}
      .site-main{grid-column:1/-1}
      .site-name{font-size:16px}
      .site-meta{font-size:13px}
      .site-move{grid-column:1/-1;grid-template-columns:1fr 1fr}
      .site-move button{height:42px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="hero">
      <div>
        <div class="title">配置中心</div>
        <div class="sub" id="summary">读取配置中...</div>
      </div>
      <div class="host" id="host"></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <section class="panel">
      <div class="panel-head">
        <div>
          <h2 id="sectionTitle">网盘登录</h2>
          <div class="hint" id="sectionHint">Cookie、TV Token 和短信登录状态</div>
        </div>
        <div class="actions" style="margin-top:0">
          <button class="ghost" id="reloadBtn">刷新状态</button>
        </div>
      </div>
      <div class="layout" id="mainLayout">
        <div class="cards" id="cards"></div>
        <aside class="detail">
          <div class="detail-head">
            <h3 id="detailTitle">配置</h3>
            <button class="drawer-close" id="drawerClose" aria-label="关闭">×</button>
          </div>
          <div class="status" id="message">请选择配置项</div>
          <div class="field" id="detailBody"></div>
        </aside>
      </div>
    </section>
  </main>
  <div class="drawer-mask" id="drawerMask"></div>
  <div class="toast" id="toast"></div>
  <script>
    const tabs = [
      ['pan', '网盘登录', 'Cookie、TV Token 和短信登录状态'],
      ['sites', '站源设置', '站源开关和排序'],
      ['settings', '综合设置', '播放线路、网盘排序和运行状态'],
      ['data', '备份数据', '导出、导入 wexfnwconfig.json']
    ];
    const cardDefs = [
      { id:'quark', tab:'pan', title:'夸克网盘', provider:'quark' },
      { id:'baidu', tab:'pan', title:'百度网盘', provider:'baidu' },
      { id:'uc', tab:'pan', title:'UC 网盘', provider:'uc' },
      { id:'thunder', tab:'pan', title:'迅雷网盘', provider:'thunder' },
      { id:'pan123', tab:'pan', title:'123 网盘', provider:'pan123' },
      { id:'pan115', tab:'pan', title:'115 网盘', provider:'pan115' },
      { id:'guangya', tab:'pan', title:'光鸭网盘', provider:'guangya' },
      { id:'pan189', tab:'pan', title:'天翼网盘', provider:'pan189' },
      { id:'new139', tab:'pan', title:'移动云盘', provider:'new139' },
      { id:'bili', tab:'pan', title:'Bili Cookie', provider:'bili' },
      { id:'pan123ziyuan', tab:'pan', title:'123分享社区', provider:'pan123ziyuan' },
      // { id:'guangyazhenying', tab:'pan', title:'光鸭臻影', provider:'guangyazhenying' },
      { id:'woniu4k', tab:'pan', title:'蜗牛影视', provider:'woniu4k' },
      // { id:'panlian', tab:'pan', title:'盘链账号', provider:'panlian' },
      { id:'sites', tab:'sites', title:'站源列表' },
      { id:'emby', tab:'settings', title:'Emby服务器', provider:'emby' },
      { id:'livetovod', tab:'settings', title:'直播 DIY' },
      { id:'settings', tab:'settings', title:'播放选项' },
      { id:'order', tab:'settings', title:'网盘排序' },
      // { id:'quarkLog', tab:'settings', title:'夸克日志' },
      { id:'backup', tab:'data', title:'配置备份' }
    ];
    let state = null, secrets = null, activeTab = localStorage.getItem('cfgTab') || 'pan', activeCard = 'quark', editingOrder = [], editingSites = [], editingEmbyIndex = -1, draggingSiteIndex = -1;
    let loginTask = null, loginTimer = null, loginPolling = false, guangYaSmsTaskId = '', woniu4kTaskId = '', new139LoginHeaders = null;
    const $ = (id) => document.getElementById(id);
    $('host').textContent = location.host || 'local';

    async function api(path, options) {
      const opts = Object.assign({ cache:'no-store' }, options || {});
      if (opts.body !== undefined && !opts.headers) opts.headers = { 'content-type':'application/json' };
      const res = await fetch(path, opts);
      const text = await res.text();
      const data = text ? JSON.parse(text) : {};
      if (!res.ok || data.code) throw new Error(data.msg || data.message || res.statusText);
      return data;
    }

    async function refresh() {
      setMessage('正在检测登录状态...');
      const [status, creds] = await Promise.all([api('/website/api/status'), api('/website/api/credentials')]);
      state = status.data;
      secrets = creds.data;
      $('summary').textContent = '登录状态已检测 · 本地配置 ' + state.dbSize + ' 字节';
      updateDrawerMode();
      render();
    }

    function render() {
      renderTabs();
      const visible = cardDefs.filter((card) => card.tab === activeTab);
      if (!visible.some((card) => card.id === activeCard)) activeCard = visible[0] ? visible[0].id : 'quark';
      $('mainLayout').className = 'layout';
      $('cards').innerHTML = visible.map(cardHtml).join('');
      document.querySelectorAll('.card').forEach((node) => node.onclick = () => {
        activeCard = node.dataset.id;
        render();
        openDrawerIfMobile();
      });
      renderDetail();
    }

    function renderTabs() {
      $('tabs').innerHTML = tabs.map(([id, name]) => '<button class="tab ' + (id === activeTab ? 'active' : '') + '" data-tab="' + id + '">' + name + '</button>').join('');
      document.querySelectorAll('.tab').forEach((node) => node.onclick = () => {
        activeTab = node.dataset.tab;
        localStorage.setItem('cfgTab', activeTab);
        closeDrawer();
        render();
      });
      const info = tabs.find(([id]) => id === activeTab) || tabs[0];
      $('sectionTitle').textContent = info[1];
      $('sectionHint').textContent = info[2];
    }

    function cardHtml(card) {
      const p = card.provider ? state.providers[card.provider] : null;
      const badge = p ? statusClass(p) : 'ok';
      const text = p ? p.state : card.id === 'settings' ? (state.showTranscode ? '极速线路显示' : '极速线路隐藏') : card.id === 'order' ? '已配置' : card.id === 'sites' ? '可管理' : card.id === 'livetovod' ? (secrets && secrets.livetovod && secrets.livetovod.url ? '已配置' : '未配置') : card.id === 'quarkLog' ? '可查看' : card.id === 'backup' ? (state.backup && state.backup.webdav && state.backup.webdav.configured ? 'WebDAV已配置' : '本地可用') : '可用';
      const meta = p ? p.label : card.id === 'order' ? labelOrder(state.panPriority) : card.id === 'sites' ? '启用、停用和调整站源顺序' : card.id === 'settings' ? '极速线路显示控制|自动弹幕开关控制|多线程模式控制' : card.id === 'livetovod' ? '支持 TXT 和 M3U' : card.id === 'quarkLog' ? '查看、复制、清空夸克播放链路日志' : card.id === 'backup' ? '本地导入导出和 WebDAV 云备份' : '导出或导入本地配置';
      return '<article class="card ' + (activeCard === card.id ? 'active' : '') + '" data-id="' + card.id + '">' +
        '<div class="card-title"><div class="name">' + card.title + '</div><span class="badge ' + badge + '">' + escapeHtml(text) + '</span></div>' +
        '<div class="meta">' + escapeHtml(meta) + '</div></article>';
    }

    function renderDetail() {
      const foundCard = cardDefs.find(c => c.id === activeCard);
      const title = foundCard ? foundCard.title : '配置';
      $('detailTitle').textContent = title;
      if (activeCard === 'quark') return renderQuark();
      if (activeCard === 'uc') return renderUc();
      if (activeCard === 'baidu') return renderBaidu();
      if (activeCard === 'pan115') return renderPan115();
      if (activeCard === 'pan123') return renderPan123();
      if (activeCard === 'pan123ziyuan') return renderPan123Ziyuan();
      if (activeCard === 'pan189') return renderPan189();
      if (activeCard === 'new139') return renderNew139();
      if (activeCard === 'bili') return renderBili();
      if (activeCard === 'guangya') return renderGuangYa();
      // if (activeCard === 'guangyazhenying') return renderGuangYaZhenYing();
      if (activeCard === 'woniu4k') return renderWoNiu4K();
      // if (activeCard === 'panlian') return renderPanLian();
      if (activeCard === 'sites') return renderSites();
      if (activeCard === 'emby') return renderEmby();
      if (activeCard === 'livetovod') return renderLiveToVod();
      if (activeCard === 'thunder') return renderThunder();
      if (activeCard === 'settings') return renderSettings();
      if (activeCard === 'order') return renderOrder();
      if (activeCard === 'quarkLog') return renderQuarkLog();
      return renderBackup();
    }

    function providerMessage(id) {
      const p = state.providers[id];
      setMessage(((p && p.state) || '') + '\n' + ((p && p.label) || ''), statusClass(p) === 'bad');
    }

    function renderQuark() {
      providerMessage('quark');
      $('detailBody').innerHTML = textarea('quarkCookie','Cookie',secrets.quark.cookie) + actions([['saveQuark','保存','primary'],['clearQuark','清除','danger']]);
      $('detailBody').innerHTML += actions([['scanQuark','扫码登录','secondary'],['registerQuark','夸克注册','register']]) + qrBoxHtml();
      $('saveQuark').onclick = () => saveCredential('quark','cookie',$('quarkCookie').value);
      $('clearQuark').onclick = () => clearCredential('quark','cookie');
      $('scanQuark').onclick = () => startLogin('quark');
      $('registerQuark').onclick = () => openRegisterLink('quark');
    }

    function renderUc() {
      providerMessage('uc');
      $('detailBody').innerHTML = textarea('ucCookie','Cookie',secrets.uc.cookie) +
        '<div class="row">' + input('ucToken','TV Token',secrets.uc.token) + input('ucRefreshToken','TV Refresh Token',secrets.uc.refreshtoken) + '</div>' +
        actions([['saveUc','保存全部','primary'],['clearUc','清除全部','danger']]);
      $('detailBody').innerHTML += actions([['scanUcCookie','扫码 Cookie','secondary'],['scanUcToken','扫码 TV Token','secondary'],['registerUc','UC注册','register']]) + qrBoxHtml();
      $('saveUc').onclick = async () => {
        await saveCredential('uc','cookie',$('ucCookie').value,false);
        await saveCredential('uc','token',$('ucToken').value,false);
        await saveCredential('uc','refreshtoken',$('ucRefreshToken').value,false);
        toast('UC 配置已保存');
        await refresh();
      };
      $('clearUc').onclick = async () => {
        await api('/website/api/uc',{method:'DELETE'});
        toast('UC 配置已清除');
        await refresh();
      };
      $('scanUcCookie').onclick = () => startLogin('ucCookie');
      $('scanUcToken').onclick = () => startLogin('ucToken');
      $('registerUc').onclick = () => openRegisterLink('uc');
    }

    function renderBaidu() {
      providerMessage('baidu');
      $('detailBody').innerHTML = textarea('baiduCookie','Cookie',secrets.baidu.cookie) + actions([['saveBaidu','保存','primary'],['clearBaidu','清除','danger']]);
      $('detailBody').innerHTML += actions([['scanBaidu','扫码登录','secondary'],['registerBaidu','百度注册','register']]) + qrBoxHtml();
      $('saveBaidu').onclick = () => saveCredential('baidu','cookie',$('baiduCookie').value);
      $('clearBaidu').onclick = () => clearCredential('baidu','cookie');
      $('scanBaidu').onclick = () => startLogin('baidu');
      $('registerBaidu').onclick = () => openRegisterLink('baidu');
    }

    function renderPan123() {
      providerMessage('pan123');
      $('detailBody').innerHTML = '<div class="row">' + input('pan123Account','123账号',secrets.pan123.account) + input('pan123Password','123密码',secrets.pan123.password) + '</div>' +

    function renderSiteEditor(selected, options) {
      const opts = options || {};
      const enabled = editingSites.filter(site => site.enable !== false).length;
      setMessage('当前启用 ' + enabled + ' / ' + editingSites.length + ' 个站源，保存后 /config 会按这里的顺序输出。');
      $('detailBody').innerHTML =
        actions([['enableAllSites','全部启用','secondary'],['disableAllSites','全部停用','ghost'],['resetSites','重置','danger'],['saveSites','保存','primary']]) +
        '<div class="site-list">' + editingSites.map((site, index) => siteRowHtml(site, index, selected)).join('') + '</div>';
      document.querySelectorAll('[data-site-toggle]').forEach((node) => {
        node.onchange = () => {
          const index = Number(node.dataset.index);
          if (!editingSites[index]) return;
          editingSites[index].enable = node.checked;
          renderSiteEditor(index);
        };
      });
      document.querySelectorAll('[data-site-up]').forEach((node) => node.onclick = () => moveSite(Number(node.dataset.index), -1));
      document.querySelectorAll('[data-site-down]').forEach((node) => node.onclick = () => moveSite(Number(node.dataset.index), 1));
      bindSiteDragEvents();
      $('enableAllSites').onclick = () => setAllSites(true);
      $('disableAllSites').onclick = () => setAllSites(false);
      $('resetSites').onclick = resetSites;
      $('saveSites').onclick = saveSites;
      if (opts.keepVisible !== false) focusSiteRow(selected);
    }

    function siteRowHtml(site, index, selected) {
      const cls = ['site-row'];
      if (site.enable === false) cls.push('disabled');
      if (index === selected) cls.push('selected');
      return '<div class="' + cls.join(' ') + '" data-index="' + index + '">' +
        '<div class="site-drag" title="按住拖动排序" data-site-drag data-index="' + index + '" draggable="true"><span class="site-drag-mark">::</span><span>拖动排序</span></div>' +
        '<label class="site-toggle"><input type="checkbox" data-site-toggle data-index="' + index + '" ' + (site.enable !== false ? 'checked' : '') + '><span>启用</span></label>' +
        '<div class="site-main"><div class="site-name">' + escapeHtml(site.name || site.key) + '</div><div class="site-meta">' + (index + 1) + '. ' + escapeHtml(site.key) + ' · ' + siteTypeName(site.type) + '</div></div>' +
        '<div class="site-move"><button data-site-up data-index="' + index + '" ' + (index <= 0 ? 'disabled' : '') + '>上</button><button data-site-down data-index="' + index + '" ' + (index >= editingSites.length - 1 ? 'disabled' : '') + '>下</button></div>' +
        '</div>';
    }

    function moveSite(index, step) {
      const next = index + step;
      if (next < 0 || next >= editingSites.length) return;
      const item = editingSites[index];
      editingSites[index] = editingSites[next];
      editingSites[next] = item;
      renderSiteEditor(next);
    }

    function bindSiteDragEvents() {
      document.querySelectorAll('.site-row').forEach((row) => {
        row.ondragstart = (event) => {
          draggingSiteIndex = Number(row.dataset.index);
          row.classList.add('dragging');
          if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', String(draggingSiteIndex));
          }
        };
        row.ondragend = () => {
          draggingSiteIndex = -1;
          document.querySelectorAll('.site-row').forEach(item => item.classList.remove('dragging','drag-over'));
        };
        row.ondragover = (event) => {
          event.preventDefault();
          const target = Number(row.dataset.index);
          if (target !== draggingSiteIndex) row.classList.add('drag-over');
          if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
        };
        row.ondragleave = () => row.classList.remove('drag-over');
        row.ondrop = (event) => {
          event.preventDefault();
          row.classList.remove('drag-over');
          const from = draggingSiteIndex >= 0 ? draggingSiteIndex : Number(event.dataTransfer && event.dataTransfer.getData('text/plain'));
          const to = Number(row.dataset.index);
          moveSiteTo(from, to);
        };
      });
    }

    function moveSiteTo(from, to) {
      if (from < 0 || from >= editingSites.length || to < 0 || to >= editingSites.length || from === to) return;
      const item = editingSites.splice(from, 1)[0];
      editingSites.splice(to, 0, item);
      draggingSiteIndex = -1;
      renderSiteEditor(to);
    }

    function focusSiteRow(index) {
      setTimeout(() => {
        const row = document.querySelector('.site-row[data-index="' + index + '"]');
        if (!row) return;
        row.scrollIntoView({ block: 'center', inline: 'nearest' });
      }, 0);
    }

    function setAllSites(enable) {
      editingSites = editingSites.map(site => Object.assign({}, site, { enable }));
      renderSiteEditor(0);
    }

    async function startLogin(provider) {
      clearLoginTimer();
      setMessage('正在生成二维码...');
      const result = await api('/website/api/login/start',{method:'POST',body:JSON.stringify({provider})});
      loginTask = { provider, taskId: result.taskId };
      showQr(result.qrImage, result.msg || '请扫码确认');
      if (isManualLoginProvider(provider)) {
        setMessage(manualLoginMessage(provider));
        return;
      }
      loginTimer = setInterval(() => pollLogin().catch(handleError), 1500);
      await pollLogin();
    }

    async function startBiliLogin() {
      clearLoginTimer();
      setMessage('正在生成 Bili 二维码...');
      const result = await api('/website/api/bili/login/start',{method:'POST',body:'{}'});
      loginTask = { provider: 'bili', taskId: result.taskId };
      showQr(result.qrImage, result.msg || '请使用哔哩哔哩 App 扫码确认');
      if (isManualLoginProvider('bili')) {
        setMessage(manualLoginMessage('bili'));
        return;
      }
      loginTimer = setInterval(() => pollLogin().catch(handleError), 1500);
      await pollLogin();
    }

    async function pollLogin() {
      if (!loginTask || loginPolling) return;
      loginPolling = true;
      try {
        const path = loginTask.provider === 'bili' ? '/website/api/bili/login/poll' : '/website/api/login/poll';
        const result = await api(path,{method:'POST',body:JSON.stringify(loginTask)});
        setMessage(result.msg || '等待扫码确认');
        if (result.status === 'success') {
          clearLoginTimer();
          toast(result.msg || '登录成功');
          await refresh();
        } else if (result.terminal || result.status === 'expired' || result.status === 'error') {
          clearLoginTimer();
          setMessage(result.msg || '登录失败', true);
        }
      } finally {
        loginPolling = false;
      }
    }

    async function cancelLogin() {
      if (loginTask) {
        const path = loginTask.provider === 'bili' ? '/website/api/bili/login/cancel' : '/website/api/login/cancel';
        await api(path,{method:'POST',body:JSON.stringify(loginTask)});
      }
      clearLoginTimer();
      setMessage('已取消登录');
    }

    function clearLoginTimer() {
      if (loginTimer) clearInterval(loginTimer);
      loginTimer = null;
      loginTask = null;
      loginPolling = false;
    }

      img.src = src || '';
      box.style.display = 'block';
      const cancel = $('cancelLoginBtn');
      if (cancel) cancel.onclick = () => cancelLogin().catch(handleError);
      const confirm = $('confirmLoginBtn');
      if (confirm) {
        confirm.style.display = isManualLoginProvider(loginTask && loginTask.provider) ? 'inline-flex' : 'none';
        confirm.onclick = () => pollLogin().catch(handleError);
      }
      setMessage(text || '请扫码确认');
    }

      select.selectedIndex = Math.max(0, Math.min(selected || 0, editingOrder.length - 1));

    function moveOrder(step) {
      const select = $('panOrderSelect');
      const i = select.selectedIndex < 0 ? 0 : select.selectedIndex;
      const j = i + step;
      if (j < 0 || j >= editingOrder.length) return;
      const tmp = editingOrder[i];
      editingOrder[i] = editingOrder[j];
      editingOrder[j] = tmp;
      updateOrderSelect(j);
    }

      if (provider === 'bili') return '请使用哔哩哔哩 App 扫码确认，扫完后点击“扫码后点我”';
      if (provider === 'guangya') return '请使用光鸭 App 扫码确认，扫完后点击“扫码后点我”';
      return '请使用 115 App 扫码确认，扫完后点击“扫码后点我”';
    }
    function setMessage(text,bad){$('message').className = 'status ' + (bad ? 'bad' : ''); $('message').textContent = text || ''}
    function toast(text){const node=$('toast');node.textContent=text;node.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>node.classList.remove('show'),1900)}
    function statusClass(p){return p && p.login ? 'ok' : p && p.configured ? 'bad' : 'warn'}
    function guangYaSavedPhone(){try{return JSON.parse(secrets.guangya.token || '{}').phone || ''}catch{return ''}}
    function new139Session(){try{return JSON.parse((secrets.new139 && secrets.new139.session) || '{}')}catch{return {}}}
    function maskClientAccount(value){
      const text = String(value || '').trim();
      if (!text) return '';
      if (/^1\d{10}$/.test(text)) return text.slice(0,3) + '****' + text.slice(-4);
      if (text.length <= 6) return text.slice(0,1) + '***';
      return text.slice(0,3) + '***' + text.slice(-3);
    }
    function showNew139Captcha(result){
      const box = $('new139CaptchaBox');
      if (!box) return;
      if (!result || !result.captcha || !result.captchaUrl) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
      }
      const url = result.captchaUrl;
      box.style.display = 'block';
      box.innerHTML =
        '<div class="status">需要滑块验证，在下方完成后等待短信验证码。</div>' +
        '<iframe src="' + escapeHtml(url) + '" style="width:100%;height:360px;border:1px solid #1f5680;border-radius:8px;background:#fff"></iframe>';
    }
    function openRegisterLink(provider){
      const links = state && state.remoteWex && state.remoteWex.registerLinks ? state.remoteWex.registerLinks : {};
      const url = links[provider] || '';
      const lower = String(url || '').toLowerCase();
      if (!(lower.indexOf('http://') === 0 || lower.indexOf('https://') === 0)) return toast('远程配置未提供注册链接');
      window.open(url, '_blank');
    }
    function nameOf(id){return state.providerNames[id] || id}
    function labelOrder(value){return String(value || '').split(',').filter(Boolean).map(nameOf).join(' > ')}
    function formatBytes(size){const units=['B','KB','MB'];let value=Number(size||0),i=0;while(value>=1024&&i<units.length-1){value/=1024;i++}return (i?value.toFixed(1):String(value)) + units[i]}
    function escapeHtml(value){return String(value || '').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
    function handleError(error){const text=error && error.message ? error.message : String(error || '操作失败');setMessage(text,true);toast(text)}
    $('reloadBtn').onclick = () => refresh().catch(handleError);
    $('drawerClose').onclick = closeDrawer;
    $('drawerMask').onclick = closeDrawer;
    function downloadDb(){window.open('/website/api/db','_blank')}
    function isMobileLayout(){return window.matchMedia('(max-width:1180px)').matches || window.matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints > 0 || /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)}
    function updateDrawerMode(){
      const enabled = isMobileLayout();
      document.body.classList.toggle('drawer-mode', enabled);
      relocateDetail(enabled);
      if (!enabled) closeDrawer();
    }
    function openDrawerIfMobile(){
      updateDrawerMode();
      if (document.body.classList.contains('drawer-mode')) document.body.classList.add('drawer-open');
    }
    function closeDrawer(){document.body.classList.remove('drawer-open')}
    function relocateDetail(enabled){
      const detail = document.querySelector('.detail');
      if (!detail) return;
      if (enabled) {
        if (detail.parentElement !== document.body) document.body.appendChild(detail);
        return;
      }
      const layout = $('mainLayout');
      if (layout && detail.parentElement !== layout) layout.appendChild(detail);
    }
    window.addEventListener('error', e => handleError(e.error || e.message));
    window.addEventListener('unhandledrejection', e => handleError(e.reason));
    window.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
    window.addEventListener('resize', updateDrawerMode);
    updateDrawerMode();
    refresh().catch(handleError);
  </script>
</body>
</html>
